name: Rust - gpu tests
on:
    # TODO: run only if vk-video code changed
    # TODO: what happens if 2 workers are spawned at the same time?
    workflow_dispatch: {}
    push:
        branches: [master]
    pull_request:
        types: [opened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    run_gpu_tests:
        runs-on: self-hosted
        steps:
            - name: 🛠 Install system dependencies
              run: |
                  set -e
                  sudo apt-get update -y -qq
                  sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libopus-dev
                  sudo apt-get clean
                  sudo rm -rf /var/lib/apt/lists/*

            - name: ℹ️ GPU info
              run: vulkaninfo
              
            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.94

            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "linux-build"

            - name: ℹ️ vk-video
              run: cargo run --package vk-video --example encode_wgpu 1280 720 30

            - name: 📦 Upload failed snapshot test artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: failed_snapshot_tests
                  path: integration-tests/failed_snapshot_tests
                  retention-days: 2
                  

              
